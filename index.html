<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Albaranes La Mina Chamartín</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
 --ground:#F6F3EC;--surface:#FFFDF8;--surface-2:#F0EBDF;--ink:#15211C;--ink-2:#54605A;--ink-3:#7D877F;
 --line:#E3DCCD;--line-2:#CFC5AF;--brand:#101A15;--cream:#EFE3C6;
 --m6:#2E74C8;--m7:#00897A;--m8:#C0561A;--m9:#7A3FA6;--cur:#7A3FA6;
 --up:#C0561A;--down:#146B3A;--flat:#6B7A72;--stop:#8A6A18;
 --up-bg:#F8E7DA;--down-bg:#E4F0E6;--flat-bg:#EDEAE1;--stop-bg:#F7EFD8;
 --shadow:0 1px 2px rgba(20,32,26,.05),0 10px 30px -22px rgba(20,32,26,.45);--r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ground:#11150F;--surface:#191E17;--surface-2:#222819;--ink:#F1EEE2;--ink-2:#B4B9AD;--ink-3:#8C9287;
 --line:#2C3329;--line-2:#3E4739;--brand:#0A0E09;--cream:#EFE3C6;
 --m6:#6C8FE8;--m7:#12A18F;--m8:#D4692A;--m9:#A073D6;--cur:#A073D6;
 --up:#E58150;--down:#5FBF84;--flat:#9AA79D;--stop:#D9B25C;
 --up-bg:#2E1E13;--down-bg:#17291D;--flat-bg:#232A20;--stop-bg:#2A2414;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
 --ground:#11150F;--surface:#191E17;--surface-2:#222819;--ink:#F1EEE2;--ink-2:#B4B9AD;--ink-3:#8C9287;
 --line:#2C3329;--line-2:#3E4739;--brand:#0A0E09;--cream:#EFE3C6;
 --m6:#6C8FE8;--m7:#12A18F;--m8:#D4692A;--m9:#A073D6;--cur:#A073D6;
 --up:#E58150;--down:#5FBF84;--flat:#9AA79D;--stop:#D9B25C;
 --up-bg:#2E1E13;--down-bg:#17291D;--flat-bg:#232A20;--stop-bg:#2A2414;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
h1,h2,h3,h4{font-family:Oswald,"Libre Franklin",sans-serif;font-weight:600;margin:0;text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
/* header */
header.brand{background:var(--brand);color:var(--cream);border-bottom:3px solid var(--cur)}
.brandrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-block:20px 16px}
.brandrow img{width:100px;border-radius:6px}
.brandrow h1{font-size:clamp(23px,4.6vw,32px);line-height:1.05;color:var(--cream);text-transform:uppercase;letter-spacing:.02em}
.brandrow p{margin:.3rem 0 0;color:#ADA891;font-size:13px}
.months{margin-left:auto;display:flex;gap:6px;background:#1B241C;padding:5px;border-radius:999px;border:1px solid #2B342A}
.mbtn{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.09em;text-transform:uppercase;border:0;background:transparent;color:#C7C1A8;padding:8px 16px;border-radius:999px;cursor:pointer}
.mbtn[aria-pressed="true"]{background:var(--cur);color:#fff}
.mbtn:hover:not([aria-pressed="true"]){background:#242E24;color:var(--cream)}
@media(max-width:560px){.months{margin-left:0;width:100%;justify-content:space-between}.mbtn{padding:8px 9px;font-size:12px;letter-spacing:.04em}}
/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.07em;text-transform:uppercase;border:0;background:transparent;color:var(--ink-2);padding:14px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cur)}
.tab:hover{color:var(--ink)}
.tab.soft{color:var(--ink-3);margin-left:auto;font-size:12px}
main{padding-block:28px 40px}
.head{margin-bottom:18px}
.head h2{font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.head p{margin:4px 0 0;color:var(--ink-2);font-size:14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;text-transform:uppercase;letter-spacing:.07em}
.panel .sub{color:var(--ink-3);font-size:12.5px;margin:3px 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:clamp(22px,3.4vw,30px);font-weight:600;letter-spacing:-.02em;margin-top:4px}
.kpi small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px}
.kpi.hero{background:linear-gradient(180deg,var(--surface),var(--surface-2));border-color:var(--line-2)}
.kpi.hero b{color:var(--cur)}
/* state cards */
.states{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.state{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:14px 16px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow)}
.state:hover{border-color:var(--c)}
.state b{display:block;font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;color:var(--c);line-height:1.1;margin:2px 0}
.state span{font-size:12.5px;color:var(--ink-2)}
.state .eyebrow{color:var(--ink-3)}
/* month bars */
.mrow{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:7px 0}
.mrow .track{background:var(--surface-2);border-radius:5px;height:22px;overflow:hidden}
.mrow .fill{height:100%;border-radius:0 5px 5px 0;display:block}
.mrow .v{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600}
.chart{display:grid;grid-template-columns:minmax(96px,150px) 1fr;gap:8px 12px;align-items:center}
.chart .cn{font-size:12.5px;color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{height:10px;border-radius:0 4px 4px 0;min-width:2px;position:relative}
.bar span{position:absolute;left:calc(100% + 6px);top:-4px;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line);margin-top:10px;padding-top:5px;font-family:"IBM Plex Mono",monospace}
/* movers */
.mov{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dotted var(--line)}
.mov:last-child{border-bottom:0}
.mov .p{font-size:13.5px;line-height:1.25}
.mov .p small{display:block;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.mov .v{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.mov .v b{color:var(--ink)}
.pill{font-family:Oswald,sans-serif;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.up{background:var(--up-bg);color:var(--up)}
.pill.down{background:var(--down-bg);color:var(--down)}
.pill.flat{background:var(--flat-bg);color:var(--flat)}
.pill.stop{background:var(--stop-bg);color:var(--stop)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.tw.scroll{max-height:520px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);position:sticky;top:0;z-index:1}
th.s{cursor:pointer;user-select:none}
th[aria-sort="descending"]::after{content:" ↓"}th[aria-sort="ascending"]::after{content:" ↑"}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
/* controls */
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=search],select{font:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink)}
input[type=search]{min-width:190px}
.chip{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
:is(.chip,.tab,.mbtn,.state,input,select,a,th.s):focus-visible{outline:2px solid var(--cur);outline-offset:2px}
.note{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.empty{padding:16px;color:var(--ink-3);font-size:13.5px}
.banner{background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--stop);border-radius:var(--r);padding:12px 15px;font-size:13.5px;color:var(--ink-2);margin-bottom:16px}
footer{border-top:1px solid var(--line);margin-top:30px;padding-block:20px 34px;color:var(--ink-3);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function classify(m){
  const up=[],down=[],same=[],stopped=[],nuevos=[];
  DATA.productos.forEach(p=>{
    const cur=p.p[String(m)], prev=prevPrice(p,m);
    if(cur==null){
      if(prev) stopped.push({...p,last:prev.m,lastv:prev.v,gap:m-prev.m});
      return;
    }
    if(!prev){ nuevos.push({...p,cur}); return; }
    const dif=cur-prev.v, dp=prev.v?dif/prev.v:null;
    const row={...p,cur,prev:prev.v,prevM:prev.m,dif,dp};
    if(Math.abs(dif)<1e-9){
      let since=prev.m;
      for(let k=prev.m-1;k>=MONTHS[0];k--){ if(p.p[String(k)]!=null && Math.abs(p.p[String(k)]-cur)<1e-9) since=k; else if(p.p[String(k)]!=null) break; }
      same.push({...row,since});
    } else if(dif>0) up.push(row); else down.push(row);
  });
  up.sort((a,b)=>(b.dp||0)-(a.dp||0)); down.sort((a,b)=>(a.dp||0)-(b.dp||0));
  same.sort((a,b)=>a.prov.localeCompare(b.prov,'es')||a.prod.localeCompare(b.prod,'es'));
  stopped.sort((a,b)=>b.gap-a.gap||b.lastv-a.lastv);
  return {up,down,same,stopped,nuevos};
}
const provTotals=m=>{
  const cur=byM[m], p1=byM[m-1], p2=byM[m-2];
  const names=new Set();[cur,p1,p2].forEach(x=>x&&x.prov.forEach(p=>names.add(p.name)));
  const get=(x,n)=>{const f=x&&x.prov.find(p=>p.name===n);return f?f.base:null;};
  const getn=(x,n)=>{const f=x&&x.prov.find(p=>p.name===n);return f?f.n:0;};
  return [...names].map(n=>{
    const a=get(cur,n)||0,b=get(p1,n),c=get(p2,n);
    return {name:n,cur:a,p1:b,p2:c,n:getn(cur,n),dif:b==null?null:a-b,dp:(b?a/b-1:null)};
  }).sort((x,y)=>y.cur-x.cur||(y.p1||0)-(x.p1||0));
};

/* ---------- navegación ---------- */
const TABS=[['resumen','Resumen'],['cambios','Suben y bajan'],['iguales','Precios iguales'],['fuera','Ya no se compran'],['prov','Por proveedor'],['inc','Incidencias']];
function renderNav(){
  document.getElementById('months').innerHTML=MONTHS.map(m=>`<button class="mbtn" data-m="${m}" aria-pressed="${m===mes}">${MNAME[m]}</button>`).join('');
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab${k==='inc'?' soft':''}" role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join('');
  document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{mes=+b.dataset.m;save();renderNav();render();});
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;save();renderNav();render();window.scrollTo({top:0,behavior:'smooth'});});
}
function save(){try{localStorage.setItem('lamina-tab',tab);localStorage.setItem('lamina-mes',String(mes));}catch(e){}}
function go(t){tab=t;save();renderNav();render();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- vistas ---------- */
function vResumen(){
  const c=byM[mes],p1=byM[mes-1],p2=byM[mes-2],S=classify(mes);
  const dif=p1?c.base-p1.base:null, dp=p1?c.base/p1.base-1:null;
  const maxB=Math.max(...DATA.months.map(m=>m.base));
  const ivas=Object.entries(c.iva).sort((a,b)=>a[0]-b[0]);
  const mi=Math.max(...ivas.map(i=>i[1]));
  const top=c.prov.slice(0,6), mt=Math.max(...top.map(p=>p.base),1);
  return `
  <div class="head"><h2>${MNAME[mes]} 2026</h2><p>Lo que se ha comprado este mes y cómo queda frente a los meses anteriores.</p></div>
  <div class="kpis">
    <div class="kpi hero"><span class="eyebrow">Compras del mes (base)</span><b>${eur(c.base)}</b><small>${p1?`${pc(dp)} respecto a ${MNAME[mes-1].toLowerCase()} (${eur(dif)})`:'primer mes con datos'}</small></div>
    <div class="kpi"><span class="eyebrow">Total con IVA</span><b>${eur(c.total)}</b><small>IVA ${eur(c.total-c.base)}</small></div>
    <div class="kpi"><span class="eyebrow">Albaranes</span><b>${c.nalb}</b><small>de ${c.prov.length} proveedores</small></div>
    <div class="kpi"><span class="eyebrow">Gasto medio por albarán</span><b>${eur(c.base/c.nalb)}</b><small>base imponible</small></div>
  </div>
  <div class="grid2">
    <div class="panel">
      <h3>Mes a mes</h3><p class="sub">Base imponible de las compras</p>
      ${DATA.months.map(m=>`<div class="mrow"><span class="eyebrow">${MNAME[m.m]}</span>
        <span class="track"><span class="fill" style="width:${m.base/maxB*100}%;background:${col(m.m)}"></span></span>
        <span class="v" style="color:${m.m===mes?col(m.m):'var(--ink-2)'}">${eur0(m.base)}</span></div>`).join('')}
      <p class="note">${p2?`Frente a ${MNAME[mes-2].toLowerCase()} (${eur0(p2.base)}), ${MNAME[mes].toLowerCase()} queda en ${pc(c.base/p2.base-1)}.`:''}</p>
    </div>
    <div class="panel">
      <h3>Reparto por tipo de IVA</h3><p class="sub">${MNAME[mes]} 2026</p>
      ${ivas.map(([k,v])=>`<div class="mrow"><span class="eyebrow">IVA ${Math.round(k*100)} %</span>
        <span class="track" style="height:18px"><span class="fill" style="width:${v/mi*100}%;background:${col(mes)}"></span></span>
        <span class="v">${eur(v)}</span></div>`).join('')}
    </div>
  </div>
  <div style="height:16px"></div>
  <h3 style="font-size:15px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">Qué ha pasado con los precios</h3>
  <div class="states">
    <button class="state" style="--c:var(--up)" onclick="go('cambios')"><span class="eyebrow">Precios</span><b>${S.up.length}</b><span>han subido</span></button>
    <button class="state" style="--c:var(--down)" onclick="go('cambios')"><span class="eyebrow">Precios</span><b>${S.down.length}</b><span>han bajado</span></button>
    <button class="state" style="--c:var(--flat)" onclick="go('iguales')"><span class="eyebrow">Precios</span><b>${S.same.length}</b><span>siguen igual</span></button>
    <button class="state" style="--c:var(--stop)" onclick="go('fuera')"><span class="eyebrow">Productos</span><b>${S.stopped.length}</b><span>no se han comprado</span></button>
  </div>
  <div style="height:16px"></div>
  <div class="panel">
    <h3>Los proveedores con más gasto</h3><p class="sub">${MNAME[mes]} 2026 · base imponible</p>
    ${top.map(p=>`<div class="mrow" style="grid-template-columns:minmax(120px,190px) 1fr auto"><span style="font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>
      <span class="track" style="height:16px"><span class="fill" style="width:${p.base/mt*100}%;background:${col(mes)}"></span></span>
      <span class="v">${eur0(p.base)}</span></div>`).join('')}
    <p class="note">Detalle completo y comparación con los dos meses anteriores en <button class="chip" onclick="go('prov')">Por proveedor</button></p>
  </div>`;
}

function movList(rows,cls,mesRef){
  if(!rows.length) return '<p class="empty">Ninguno este mes.</p>';
  return rows.map(r=>`<div class="mov"><span class="p">${esc(r.prod)}<small>${esc(r.prov)}</small></span>
   <span class="v">${price(r.prev)} → <b>${price(r.cur)}</b></span>
   <span class="pill ${cls}">${pc(r.dp)}</span></div>`).join('');
}
function vCambios(){
  const S=classify(mes);
  if(!byM[mes-1]&&!byM[mes-2]) return `<div class="head"><h2>Suben y bajan</h2></div><div class="banner">${MNAME[mes]} es el primer mes con datos, así que todavía no hay con qué comparar los precios.</div>`;
  const provs=[...new Set([...S.up,...S.down].map(r=>r.prov))].sort((a,b)=>a.localeCompare(b,'es'));
  return `
  <div class="head"><h2>Precios que suben y bajan</h2><p>Comparado con el último precio anterior de cada producto (${MNAME[mes-1].toLowerCase()} o, si ese mes no se compró, el anterior).</p></div>
  <div class="ctrl">
    <select id="fprov" aria-label="Filtrar por proveedor"><option value="">Todos los proveedores</option>${provs.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
    <input type="search" id="fq" placeholder="Buscar producto…" aria-label="Buscar producto">
  </div>
  <div class="grid2">
    <div class="panel"><h3 style="color:var(--up)">Suben · <span class="num" id="nup">${S.up.length}</span></h3><p class="sub">De la subida más fuerte a la más suave</p><div id="lup">${movList(S.up,'up')}</div></div>
    <div class="panel"><h3 style="color:var(--down)">Bajan · <span class="num" id="ndown">${S.down.length}</span></h3><p class="sub">De la bajada más fuerte a la más suave</p><div id="ldown">${movList(S.down,'down')}</div></div>
  </div>
  <p class="note">Los precios son sin IVA, por unidad de compra (caja, kilo o unidad, según el proveedor).</p>`;
}
function wireCambios(){
  const S=classify(mes), sel=document.getElementById('fprov'), q=document.getElementById('fq');
  if(!sel) return;
  const f=()=>{
    const p=sel.value, t=q.value.trim().toLowerCase();
    const flt=r=>(!p||r.prov===p)&&(!t||(r.prod+' '+r.prov).toLowerCase().includes(t));
    const u=S.up.filter(flt), d=S.down.filter(flt);
    document.getElementById('lup').innerHTML=movList(u,'up');
    document.getElementById('ldown').innerHTML=movList(d,'down');
    document.getElementById('nup').textContent=u.length; document.getElementById('ndown').textContent=d.length;
  };
  sel.oninput=f; q.oninput=f;
}

function vIguales(){
  const S=classify(mes);
  if(!byM[mes-1]) return `<div class="head"><h2>Precios iguales</h2></div><div class="banner">${MNAME[mes]} es el primer mes con datos: no hay comparación posible.</div>`;
  return `
  <div class="head"><h2>Precios que siguen igual</h2><p>${S.same.length} productos mantienen el mismo precio que la última vez que se compraron.</p></div>
  <div class="ctrl"><input type="search" id="qig" placeholder="Buscar producto o proveedor…" aria-label="Buscar"><span class="note" id="nig"></span></div>
  <div class="tw scroll"><table id="tig"><thead><tr><th>Proveedor</th><th>Producto</th><th class="r">Precio</th><th>Sin cambios desde</th></tr></thead><tbody></tbody></table></div>`;
}
function wireIguales(){
  const S=classify(mes), q=document.getElementById('qig'); if(!q) return;
  const f=()=>{
    const t=q.value.trim().toLowerCase();
    const r=S.same.filter(x=>!t||(x.prod+' '+x.prov).toLowerCase().includes(t));
    document.querySelector('#tig tbody').innerHTML=r.map(x=>`<tr><td>${esc(x.prov)}</td><td>${esc(x.prod)}</td>
      <td class="r num"><b>${price(x.cur)}</b></td><td><span class="pill flat">${MNAME[x.since]}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sin resultados.</td></tr>';
    document.getElementById('nig').textContent=r.length+' de '+S.same.length+' productos';
  };
  q.oninput=f; f();
}

function vFuera(){
  const S=classify(mes);
  const dos=S.stopped.filter(s=>s.gap>=2).length;
  return `
  <div class="head"><h2>Productos que ya no se compran</h2><p>Productos con compras en meses anteriores y ninguna en ${MNAME[mes].toLowerCase()}. ${dos} llevan dos meses o más sin comprarse.</p></div>
  <div class="ctrl">
    <button class="chip" id="cdos" aria-pressed="false">Solo los que llevan 2 meses o más</button>
    <input type="search" id="qf" placeholder="Buscar producto o proveedor…" aria-label="Buscar">
    <span class="note" id="nf"></span>
  </div>
  <div class="tw scroll"><table id="tf"><thead><tr><th>Proveedor</th><th>Producto</th><th>Última compra</th><th class="r">Último precio</th><th>Tiempo sin comprar</th></tr></thead><tbody></tbody></table></div>`;
}
function wireFuera(){
  const S=classify(mes), q=document.getElementById('qf'), c=document.getElementById('cdos'); if(!q) return;
  const f=()=>{
    const t=q.value.trim().toLowerCase(), only=c.getAttribute('aria-pressed')==='true';
    let r=S.stopped.filter(x=>(!only||x.gap>=2)&&(!t||(x.prod+' '+x.prov).toLowerCase().includes(t)));
    document.querySelector('#tf tbody').innerHTML=r.map(x=>`<tr><td>${esc(x.prov)}</td><td>${esc(x.prod)}</td>
      <td><span class="eyebrow">${MNAME[x.last]} 2026</span></td><td class="r num">${price(x.lastv)}</td>
      <td><span class="pill ${x.gap>=2?'stop':'flat'}">${x.gap} ${x.gap===1?'mes':'meses'}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin resultados.</td></tr>';
    document.getElementById('nf').textContent=r.length+' de '+S.stopped.length+' productos';
  };
  q.oninput=f; c.onclick=()=>{c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true');f();}; f();
}

let psort={k:'cur',dir:-1};
function vProv(){
  const rows=provTotals(mes);
  const shown=rows.filter(r=>r.cur>0||r.p1||r.p2).slice(0,14);
  const maxV=Math.max(...shown.map(r=>Math.max(r.cur,r.p1||0,r.p2||0)),1);
  const step=maxV>10000?4000:maxV>6000?2000:1000, ticks=[];for(let t=0;t<=maxV;t+=step)ticks.push(t);
  const mm=[mes-2,mes-1,mes].filter(x=>byM[x]);
  return `
  <div class="head"><h2>Total por proveedor</h2><p>Base imponible de ${MNAME[mes].toLowerCase()} y los dos meses anteriores.</p></div>
  <div class="panel">
    <h3>Comparativa de los 14 proveedores con más gasto</h3><p class="sub">Una barra por mes; la etiqueta marca el importe de ${MNAME[mes].toLowerCase()}</p>
    <div class="legend">${mm.map(m=>`<span><span class="sw" style="background:${col(m)}"></span>${MNAME[m]}</span>`).join('')}</div>
    <div class="chart">${shown.map(r=>`<div class="cn" title="${esc(r.name)}">${esc(r.name)}</div><div class="bars">
      ${mm.map(m=>{const v=m===mes?r.cur:(m===mes-1?r.p1:r.p2)||0;
        return `<div class="bar" style="width:${Math.max(0.4,v/maxV*86)}%;background:${col(m)}" title="${esc(r.name)} · ${MNAME[m]}: ${eur(v)}">${m===mes&&v>maxV*0.14?`<span>${eur0(v)}</span>`:''}</div>`;}).join('')}
    </div>`).join('')}</div>
    <div class="chart" style="margin-top:8px"><div></div><div style="position:relative;height:20px;border-top:1px solid var(--line)">${ticks.map(t=>`<span class="num" style="position:absolute;left:${t/maxV*86}%;top:5px;font-size:11px;color:var(--ink-3);white-space:nowrap;transform:translateX(${t?'-50%':'0'})">${t.toLocaleString('es-ES')} €</span>`).join('')}</div></div>
  </div>
  <div style="height:16px"></div>
  <div class="ctrl"><input type="search" id="qp" placeholder="Buscar proveedor…" aria-label="Buscar proveedor"><span class="note">Pulsa una cabecera para ordenar</span></div>
  <div class="tw scroll"><table id="tp"><thead><tr><th>Proveedor</th><th class="r s" data-k="n">Albaranes</th>
    <th class="r s" data-k="cur">${MNAME[mes]}</th><th class="r s" data-k="p1">${byM[mes-1]?MNAME[mes-1]:'—'}</th><th class="r s" data-k="p2">${byM[mes-2]?MNAME[mes-2]:'—'}</th>
    <th class="r s" data-k="dif">Dif. €</th><th class="r s" data-k="dp">Dif. %</th></tr></thead><tbody></tbody></table></div>
  <p class="note">«Dif.» compara ${MNAME[mes].toLowerCase()} con ${byM[mes-1]?MNAME[mes-1].toLowerCase():'el mes anterior'}. En rojo, se gasta más; en verde, menos.</p>`;
}
function wireProv(){
  const rows=provTotals(mes), q=document.getElementById('qp'); if(!q) return;
  const f=()=>{
    const t=q.value.trim().toLowerCase();
    let r=rows.filter(x=>!t||x.name.toLowerCase().includes(t));
    r.sort((a,b)=>{const A=a[psort.k],B=b[psort.k];if(A==null)return 1;if(B==null)return -1;return (A-B)*psort.dir;});
    document.querySelector('#tp tbody').innerHTML=r.map(x=>`<tr><td>${esc(x.name)}</td><td class="r num">${x.n||'—'}</td>
      <td class="r num"><b>${x.cur?eur(x.cur):'—'}</b></td><td class="r num">${x.p1==null?'—':eur(x.p1)}</td><td class="r num">${x.p2==null?'—':eur(x.p2)}</td>
      <td class="r num" style="color:${x.dif>0?'var(--up)':x.dif<0?'var(--down)':'var(--ink-3)'}">${x.dif==null?'—':eur(x.dif)}</td>
      <td class="r num" style="color:${x.dp>0?'var(--up)':x.dp<0?'var(--down)':'var(--ink-3)'}">${x.dp==null?'nuevo':pc(x.dp)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin resultados.</td></tr>';
    document.querySelectorAll('#tp th.s').forEach(th=>th.setAttribute('aria-sort',th.dataset.k===psort.k?(psort.dir<0?'descending':'ascending'):'none'));
  };
  q.oninput=f;
  document.querySelectorAll('#tp th.s').forEach(th=>th.onclick=()=>{const k=th.dataset.k;psort=psort.k===k?{k,dir:-psort.dir}:{k,dir:-1};f();});
  f();
}

function vInc(){
  const I=DATA.incidencias, pend=I.filter(x=>x.ESTADO==='PENDIENTE'), rev=I.filter(x=>x.ESTADO!=='PENDIENTE');
  const ord={ALTA:0,MEDIA:1,BAJA:2,INFO:3}; pend.sort((a,b)=>ord[a.PRIORIDAD]-ord[b.PRIORIDAD]||a['Nº']-b['Nº']);
  const pc=p=>p==='ALTA'?'up':p==='MEDIA'?'stop':'flat';
  return `
  <div class="head"><h2>Incidencias</h2><p>Revisión de los albaranes de septiembre (05/10/2026), más lo que sigue pendiente de julio y agosto. Casi todas necesitan una llamada al proveedor o un papel que no tenemos.</p></div>
  <div class="banner"><b>${pend.length} pendientes</b> de ${I.length}. Las otras ${rev.length} se cerraron en la revisión del 25/09/2026.</div>
  <div class="tw" style="margin-bottom:22px"><table><thead><tr><th>Nº</th><th>Prioridad</th><th>Mes</th><th>Proveedor</th><th class="r">Importe</th><th>Qué pasa</th><th>Qué hay que hacer</th></tr></thead><tbody>
  ${pend.map(x=>`<tr><td class="num">${x['Nº']}</td><td><span class="pill ${pc(x.PRIORIDAD)}">${esc(x.PRIORIDAD)}</span></td>
    <td><span class="eyebrow">${esc(x.MES)}</span></td><td style="white-space:normal;min-width:120px;max-width:190px">${esc(x.PROVEEDOR)}</td>
    <td class="r num">${x['IMPORTE (€)']==null?'—':eur(x['IMPORTE (€)'])}</td>
    <td style="white-space:normal;min-width:250px">${esc(x.TIPO)}${x.DETALLE?`<small style="display:block;color:var(--ink-2);font-size:12.5px;line-height:1.4;margin-top:4px">${esc(x.DETALLE)}</small>`:''}</td>
    <td style="white-space:normal;min-width:210px"><b>${esc(x['QUE HACER']||x['ACCIÓN SUGERIDA']||'')}</b></td></tr>`).join('')}
  </tbody></table></div>
  <details class="panel"><summary style="cursor:pointer"><h3 style="display:inline">Revisadas (${rev.length})</h3></summary>
  <div class="tw" style="margin-top:12px;box-shadow:none"><table><thead><tr><th>Nº</th><th>Mes</th><th>Proveedor</th><th class="r">Importe</th><th>Qué se ha hecho</th></tr></thead><tbody>
  ${rev.map(x=>`<tr><td class="num">${x['Nº']}</td><td><span class="eyebrow">${esc(x.MES)}</span></td><td>${esc(x.PROVEEDOR)}</td>
    <td class="r num">${x['IMPORTE (€)']==null?'—':eur(x['IMPORTE (€)'])}</td>
    <td style="white-space:normal;min-width:300px">${esc(x.RESULTADO||'')} <span class="pill down">REVISADO</span></td></tr>`).join('')}
  </tbody></table></div></details>`;
}

function render(){
  const v=document.getElementById('view');
  if(tab==='resumen'){v.innerHTML=vResumen();}
  else if(tab==='cambios'){v.innerHTML=vCambios();wireCambios();}
  else if(tab==='iguales'){v.innerHTML=vIguales();wireIguales();}
  else if(tab==='fuera'){v.innerHTML=vFuera();wireFuera();}
  else if(tab==='prov'){v.innerHTML=vProv();wireProv();}
  else {v.innerHTML=vInc();}
}
renderNav();render();
</script>
